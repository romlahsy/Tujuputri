<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Katalog lengkap produk Tujuputri: fashion dewasa, ibu dan anak, buku islami, kreasi dan stationery.">
  <meta name="theme-color" content="#f8f7f2">
  <title>Semua Produk | Tujuputri</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body data-page="catalog">

  <!-- Header bersama, dirender dari header.js -->
  <div id="site-header"></div>

  <main>
    <!-- JUDUL HALAMAN -->
    <section class="page-head section-wrap">
      <nav class="breadcrumb" aria-label="Jejak halaman">
        <a href="index.html">Beranda</a>
        <span class="crumb-sep" aria-hidden="true">/</span>
        <span aria-current="page">Semua Produk</span>
      </nav>
      <h1>Semua produk</h1>
      <p class="page-intro">Cari produk atau pilih kategori yang kamu butuhkan.</p>
    </section>

    <!-- PENCARIAN, FILTER, DAN DAFTAR PRODUK -->
    <section class="page-section section-wrap">
      <div class="search-panel">
        <label for="product-search">Cari produk</label>
        <input id="product-search" type="search" placeholder="Contoh: daster, buku, bookmark" autocomplete="off">
      </div>
      <div class="filter-row" id="filter-row" role="group" aria-label="Filter kategori"></div>
      <div class="listing-toolbar">
  <p class="result-count" id="result-count" aria-live="polite"></p>

  <div class="sort-control">
    <button
      type="button"
      class="sort-trigger"
      id="sort-trigger"
      aria-expanded="false"
      aria-controls="sort-options"
    >
      <span id="sort-label">Urutkan</span>
      <span class="sort-arrow"></span>
    </button>

    <div class="sort-options" id="sort-options" hidden>
      <button type="button" data-sort="default">Default</button>
      <button type="button" data-sort="price-low">Termurah</button>
      <button type="button" data-sort="price-high">Termahal</button>
      <button type="button" data-sort="name-az">A–Z</button>
      <button type="button" data-sort="name-za">Z–A</button>
    </div>
  </div>
</div>
      
      <div class="product-grid" id="product-grid"></div>
      <p class="empty-state" id="empty-state" hidden>Produk belum ditemukan. Coba kata kunci lain atau pilih kategori Semua.</p>
    </section>
  </main>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="social-links" id="social-links" hidden></div>
    <p class="footer-copy">© 2026 Tujuputri.</p>
    <p class="footer-text">Satu tempat untuk berbagai kebutuhan keluarga.</p>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="config.js?v=2"></script>
  <script src="header.js?v=1"></script>
  <script src="script.js?v=2"></script>
</body>
</html>
